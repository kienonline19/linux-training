<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trắc nghiệm Linux</title>
  <meta name="description" content="200 câu hỏi trắc nghiệm Linux cơ bản, có đáp án và giải thích bằng tiếng Việt và tiếng Anh.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-size='15' font-weight='700' fill='white'%3E$_%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved theme and language before first paint to avoid a flash.
    try {
      var savedTheme = localStorage.getItem("linux-quiz-theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      var savedLang = localStorage.getItem("linux-quiz-lang");
      if (savedLang) document.documentElement.lang = savedLang;
    } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">$_</span>
        <span class="brand-name" id="brand-name">Trắc nghiệm Linux</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="practice" id="nav-practice">Luyện tập</a>
        <a href="#/bank" data-nav="bank" id="nav-bank">
          <span class="nav-long">Ngân hàng câu hỏi</span><span class="nav-short">Câu hỏi</span>
        </a>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Ngôn ngữ">
          <button type="button" data-lang="vi" lang="vi" aria-pressed="true">VI</button>
          <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Chuyển giao diện sáng/tối"></button>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="site-footer" id="footer">200 câu hỏi · 10 chủ đề · có đáp án và giải thích</footer>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
